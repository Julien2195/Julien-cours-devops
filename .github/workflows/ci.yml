name: CI

on:
  pull_request:
    branches:
      - ci
      
  push:
    branches:
      - ci

jobs:
  CI:
    runs-on: ubuntu-latest

    container:
      image: node:20-alpine

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install dependencies
        run: npm install

      - name: build app
        run: npm run build

      - name: run tests
        run: npm test
