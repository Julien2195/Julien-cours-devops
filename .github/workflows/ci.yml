name: CI

on:
  pull_request:
    branches:
      - ci
      
  push:
    branches:
      - ci

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: docker build
        run: docker build -t exo .

      - name: run app 
        run: docker run -d -p 3000:3000 --name exo exo
