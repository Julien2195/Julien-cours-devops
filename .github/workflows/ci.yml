name: CI

on:
  pull_request:
    branches:
      - ci
      
  push:
    branches:
      - ci

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest

    container:
      image: node:20-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: lint

    container:
      image: node:20-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cours .

      - name: Start container
        run: docker run -d -p 3001:3000 --name cours cours
