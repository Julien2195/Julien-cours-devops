name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: npm install
        run: npm install

      - name: build app
        run: npm run build

      - name: tests front
        run: npm test
